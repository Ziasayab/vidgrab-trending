name: Update trending
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build trending.json
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: python tools/update_trending.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- trending/trending.json; then
            echo "No change"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add trending/trending.json
            git commit -m "Update trending"
            git push
          fi
